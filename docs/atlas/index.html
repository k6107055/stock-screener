<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Atlas</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--tx:#1d2129;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--pri2:#dbeafe;
  --up:#e03131;--down:#16a34a;--upbg:#fff0f0;--downbg:#ecfdf3;--warn:#b45309;--warnbg:#fff7e6;
  --r:14px;--nav:64px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#1a1d24;--tx:#e8eaed;--sub:#9aa0aa;--line:#2a2e37;--pri:#60a5fa;--pri2:#1e3a5f;
  --up:#ff6b6b;--down:#34d399;--upbg:#3a1d1f;--downbg:#123026;--warn:#fbbf24;--warnbg:#3a2e12;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding-bottom:calc(var(--nav) + 24px)}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
header h1{font-size:20px;margin:0;flex:1}
.ib{border:0;background:var(--card);color:var(--tx);width:38px;height:38px;border-radius:50%;font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
main{padding:0 12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--pri);font-weight:400;background:none;border:0;padding:0}
.sub{color:var(--sub);font-size:12.5px}
.big{font-size:30px;font-weight:700;letter-spacing:.3px}
.mid{font-size:19px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.kv{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:15px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{flex:1;min-width:0}
.row .r{text-align:right}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--pri2);color:var(--pri);margin-left:4px;vertical-align:1px;font-weight:500}
.tag.h{background:var(--upbg);color:var(--up)}
.tag.w{background:var(--warnbg);color:var(--warn)}
.pill{display:inline-block;padding:2px 8px;border-radius:8px;font-weight:600;font-size:13px}
.pill.up{background:var(--upbg)}.pill.down{background:var(--downbg)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom),10px)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:600}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--sub);padding:8px 4px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;background:var(--pri);color:#fff;font-weight:600}
.btn.g{background:var(--bg);color:var(--tx)}
.btn.red{background:var(--up)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + 26px);z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(37,99,235,.4)}
.mask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center}
.sheet h2 .x{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:16px;padding:6px 11px;font-size:13.5px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.amt{font-size:28px;font-weight:700;text-align:right}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:80;background:rgba(20,20,20,.88);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center}
.load{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--sub);padding:30px 0}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.chart{height:300px;margin:0 -6px}
.chart.s{height:170px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--pri);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--sub);font-weight:500;border-top:0}
td:first-child,th:first-child{text-align:left}
.scrollx{overflow-x:auto;margin:0 -4px}
.art{padding:10px 0;border-top:1px solid var(--line)}
.art:first-child{border-top:0}
.art a{color:var(--tx);text-decoration:none;font-weight:600}
.art p{margin:4px 0 0;color:var(--sub);font-size:13.5px}
a{color:var(--pri)}
.search{position:relative;margin-bottom:12px}
.sugg{position:absolute;left:0;right:0;top:46px;z-index:15;background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden}
.sugg div{padding:11px 14px;border-top:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:3px}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
.dayh{font-size:12.5px;color:var(--sub);padding:10px 0 2px;display:flex}
.dayh span{margin-left:auto}
.spark{width:100%;height:46px;display:block;margin-top:8px}
.tabsm{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tabsm button{white-space:nowrap;border:0;background:var(--bg);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:12.5px}
.tabsm button.on{background:var(--pri2);color:var(--pri);font-weight:600}
body.priv .m{color:transparent!important;background:var(--line);border-radius:6px;user-select:none;-webkit-user-select:none}
body.priv .m *{color:transparent!important;background:transparent!important}
body.priv .m svg,body.priv .mchart{visibility:hidden}
.ltabs{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 10px;padding:0 12px;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:18px;padding:7px 13px;font-size:14px}
.ltabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.ed{display:flex;gap:6px}.ed button{border:0;background:var(--bg);color:var(--tx);width:36px;height:34px;border-radius:9px;font-size:16px}.ed .rm{color:var(--up)}
.sr{display:flex;align-items:center;gap:8px}.sr span{flex:1}.sr .add{border:0;background:var(--pri);color:#fff;width:34px;height:30px;border-radius:9px;font-size:18px;line-height:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;font-size:14px}
table.bk td,table.bk th{text-align:center;position:relative}
table.bk td.bv,table.bk td.av{font-size:12.5px;color:var(--sub)}
table.bk td i{position:absolute;top:3px;bottom:3px;opacity:.18;border-radius:3px}
table.bk td.bv i{right:0;background:var(--up)}table.bk td.av i{left:0;background:var(--down)}
@keyframes fu{0%{background:var(--upbg)}100%{background:transparent}}@keyframes fd{0%{background:var(--downbg)}100%{background:transparent}}
.fu{animation:fu 1.2s ease-out}.fd{animation:fd 1.2s ease-out}
#lv{font-size:11.5px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
#lv .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:4px;vertical-align:1px;animation:pl 1.6s ease-in-out infinite}
#lv.bad .dot{background:#f59f00;animation:none}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.tl .yr{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.tl .yr b{font-variant-numeric:tabular-nums}
.tl .yr .pill{margin-left:auto}
.pill.flat{background:var(--bg);color:var(--sub)}
.verdict{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg);margin-top:8px}
/* iOS 手感：不要長按選字／放大鏡、不要整頁橡皮筋、點擊有回饋 */
html,body{overscroll-behavior-y:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
input,textarea,.selectable{-webkit-user-select:text;user-select:text}
button,.row,.ht.rw,[data-code],.kv,.card[id^=go]{cursor:pointer}
button:active,.ht.rw:active,.row[data-code]:active,.card[id^=go]:active{opacity:.6;transition:opacity .05s}
#main{background:var(--bg);min-height:calc(100vh - 140px)}
#main.slide{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#swipeShade{position:fixed;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none}
#ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);z-index:19;text-align:center;font-size:12.5px;color:var(--sub);height:0;overflow:hidden;transition:height .2s}
#ptr i{display:inline-block;transition:transform .2s;font-style:normal;margin-right:4px}
#btnBack{font-size:24px;line-height:1;padding-bottom:3px;margin-left:-6px;background:none;box-shadow:none;width:30px}
.sheet h2{touch-action:none}
.sheet::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 8px}
.sheet{padding-bottom:max(28px,env(safe-area-inset-bottom))}
/* 庫存（籌碼K 風格）*/
.idx{display:flex;gap:8px;margin-bottom:10px}
.idx>div{flex:1;background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.idx>div:active{opacity:.6}
.idx b{font-size:16px;display:block;font-variant-numeric:tabular-nums}
.idx small{display:block;font-size:11.5px;white-space:nowrap}
.brd{font-size:12px;color:var(--sub);margin:-4px 4px 10px}
.sum3{display:grid;grid-template-columns:1.05fr 1.05fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum3>div{padding:8px 9px;border-left:1px solid var(--line);min-width:0}.sum3>div:first-child{border-left:0}
.sum3 b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum3 small{font-size:12px}
.donut{display:flex;align-items:center;gap:14px;margin:12px 0 4px}
.donut svg{width:108px;height:108px;flex:none}
.donut ul{list-style:none;margin:0;padding:0;flex:1;font-size:13px}
.donut li{display:flex;align-items:center;gap:6px;padding:2px 0}.donut li i{width:10px;height:10px;border-radius:2px;flex:none}
.donut li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;align-items:center;column-gap:6px}
.ht.hd{font-size:12px;color:var(--sub);padding:6px 0;border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top) + 58px);background:var(--card);z-index:2}
.ht.hd button{border:0;background:none;color:inherit;font:inherit;padding:2px 0;text-align:right;width:100%}
.ht.hd button.on{color:var(--pri);font-weight:600}
.ht.rw{padding:9px 0;border-bottom:1px solid var(--line)}.ht.rw:last-child{border-bottom:0}
.ht .c{text-align:right;font-variant-numeric:tabular-nums}
.ht .c b{font-size:15.5px}
.ht .nm2{font-weight:600;font-size:15px;line-height:1.2}.ht .cd{font-size:12px;color:var(--sub)}
.lu{background:var(--up);color:#fff!important;border-radius:4px;padding:0 3px}.ld{background:var(--down);color:#fff!important;border-radius:4px;padding:0 3px}
.pk .ht{grid-template-columns:1.2fr .95fr .95fr .95fr}
label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px;margin:12px 0}label.ck input{width:22px;height:22px}
.sugg div.sr{padding:9px 10px 9px 14px}
body:not(.priv) .privhint{display:none}

/* 觀測站／YouTube */
.ofl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.ofl select,.ofl input{width:auto;font-size:14px;padding:6px 8px;border-radius:9px}
.ofl input[type=search]{flex:1;min-width:140px}
.ofl input[type=date]{max-width:150px}
.ot{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.ot:first-child{border-top:0}
.ot .h{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--sub)}
.ot .h b{color:var(--tx);font-size:14.5px}
.ot .h .tm{margin-left:auto;font-variant-numeric:tabular-nums}
.ot .s{font-size:14.5px;line-height:1.4}
.ot .r{font-size:12.5px;color:var(--sub)}
.ot .body{white-space:pre-wrap;font-size:13.5px;background:var(--bg);border-radius:10px;padding:10px;margin-top:6px;-webkit-user-select:text;user-select:text}
.ot.hd{display:none}
.ot.mine .h b::after{content:'持股';font-size:10.5px;background:var(--upbg);color:var(--up);border-radius:5px;padding:0 4px;margin-left:4px;font-weight:600}
.ot.watch .h b::after{content:'觀察';font-size:10.5px;background:var(--pri2);color:var(--pri);border-radius:5px;padding:0 4px;margin-left:4px;font-weight:600}
.yv h4{margin:4px 0 6px;font-size:15px;line-height:1.35}
.yv h4 a{color:var(--tx);text-decoration:none}
.yv .dc{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.yv .dc .kv b{font-size:13px;font-weight:500}
.yv .stk{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.yv .stk span{font-size:12.5px;background:var(--bg);border-radius:8px;padding:2px 8px}
.yv .stk span[data-code]{background:var(--pri2);color:var(--pri)}
.lib .li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--tx)}
.lib .li:first-of-type{border-top:0}
.lib .li .ic{font-size:20px;flex:none;width:26px;text-align:center}
.lib .li .tx{flex:1;min-width:0}
.lib .li .tx b{display:block;font-weight:500;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lib .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib .imgs a{display:block;aspect-ratio:1;border-radius:10px;background:var(--bg);overflow:hidden;text-decoration:none;color:var(--sub);font-size:11px;position:relative}
.lib .imgs img{width:100%;height:100%;object-fit:cover;display:block}
.lib .imgs span{position:absolute;left:4px;right:4px;bottom:3px;text-shadow:0 0 3px var(--card)}
.yv .act{margin-top:8px;font-size:13.5px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:7px 10px}
/* ====== 電腦（寬螢幕）：左側導覽＋多欄儀表板；手機不受影響 ====== */
@media (min-width:1000px){
  body{padding-bottom:28px;padding-left:92px;-webkit-user-select:text;user-select:text}
  nav{top:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:4px;padding:72px 0 12px;border-top:0;border-right:1px solid var(--line)}
  nav button{flex:none;padding:12px 0;font-size:12.5px;border-radius:12px;margin:0 8px}
  nav button.on{background:var(--pri2)}
  nav button i{font-size:24px}
  header{max-width:1480px;margin:0 auto;padding:18px 24px 12px}
  header h1{font-size:22px}
  main{max-width:1480px;margin:0 auto;padding:0 24px}
  .chart{height:440px}.chart.s{height:230px}
  .fab{bottom:32px;right:32px}
  .mask{align-items:center}
  .sheet{border-radius:18px;max-width:640px;max-height:86vh}
  .sheet::before{display:none}
  .card{break-inside:avoid}
  .idx{gap:12px}.idx>div{padding:12px 16px}.idx b{font-size:22px}.idx small{font-size:13px}
  /* 多欄：庫存、資產、資訊、記帳 */
  #main.v-home,#main.v-asset{column-count:2;column-gap:16px}
  #main.v-home>*,#main.v-asset>*{break-inside:avoid}
  .v-info #ib,.v-book #bb{column-count:2;column-gap:16px}
  .v-info #ib>.tabsm,.v-info #ib>.search,.v-info #ib>.ofl,.v-info #ib>div[style*="text-align:center"]{column-span:all}
  .v-info #ib>.card#il,.v-info #ib>.card.one{column-span:all}
  #il{column-count:2;column-gap:28px}
  #il .art{break-inside:avoid}
  /* 自選清單：多欄排列 */
  #wl .card{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px}
  #wl .card>h3,#wl .card>.btns,#wl .card>.sub,#wl .card>.empty{grid-column:1/-1}
  #wl .card>.row{border-top:0;border-bottom:1px solid var(--line)}
  /* 個股頁：左邊報價＋K 線、右邊籌碼／五檔／法人預估 */
  #sd{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(360px,1fr);gap:16px;align-items:start}
  /* 指數頁：左報價、右圖 */
  #main.v-idx{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:16px;align-items:start}
  #main.v-idx>#ixq{grid-column:1;grid-row:1}
  #main.v-idx>.card:not(#ixq){grid-column:2;grid-row:1 / span 2}
  #main.v-idx>.sub{grid-column:1;grid-row:2}
  #main.v-idx .chart{height:560px}
  /* 觀測站表格 */
  .ob .ot{grid-template-columns:92px 150px 96px minmax(0,1fr) minmax(160px,280px);column-gap:12px;align-items:start}
  .ob .ot.hd{display:grid;font-size:12px;color:var(--sub);padding:4px 0}
  .ob .ot .h{display:contents}

const RAW = 'https://raw.githubusercontent.com/k6107055/stock-screener/';
const GXM = {};
async function ghx(branch, path, maxAge){
  const k = 'gx_' + branch + '/' + path, hit = GXM[k] || ls.get(k, null);
  if (hit && Date.now() - hit.t < (maxAge || 600000)) return hit.d;
  try {
    const r = await fetch(RAW + branch + '/' + path, {cache: 'no-cache'});
    if (!r.ok) throw new Error(r.status === 404 ? '還沒有資料' : 'GitHub ' + r.status);
    const d = await r.json(), e = {d, t: Date.now()}; GXM[k] = e;
    if (JSON.stringify(d).length < 400000) ls.set(k, e);
    return d;
  } catch(e){ if (hit) return hit.d; throw e; }
}

  ((LISTS && LISTS.lists) || []).forEach(l => l.codes.forEach(c => { if (!hold.has(c)) watch.add(c); }));
  return {hold, watch};
}

// ====================== 法人預估紀錄（單一檔：每一天的上修／下修，最新在最上面）======================
let EH = null, EHQ = null;
async function vEst(code){
  const M = $('#main');
  if (!code) return go('info', undefined, {tab: true});
  $('#ttl').textContent = code + ' ' + sname(code);
  EH = ls.get('eh_' + code, null); EHQ = null;
  const tag = SEQ;
  if (EH) paintEst(code); else M.innerHTML = loading('讀取法人上下修紀錄…');
  rememberStk(code);
  call('estHist', {code}).then(d => { if (SEQ !== tag) return; EH = d; ls.set('eh_' + code, d); paintEst(code); })
    .catch(e => { if (SEQ === tag && !EH) M.innerHTML = `<div class="err">${esc(e.message)}</div>`; });
  // 現價（算「修正後到現在漲跌」），盤中也會跳
  setLive(async () => { if (VIEW !== 'est' || CUR.arg !== code) return false; const d = await call('quotes', {codes: [code]}); EHQ = d.q[code] || null; if (EH && SEQ === tag) paintEstPx(code); return d.open; });
  call('reportOf', {code}).then(r => { if (r){ REPOF[code] = r; if (SEQ === tag) paintRep(code); } }).catch(() => {});
}
const ESTF = 1;   // |調幅| 小於 1% 當作「微調」
function estKind(r){ if (r.init) return ['初評', 'flat']; if (r.pct == null) return ['首次紀錄', 'flat']; if (Math.abs(r.pct) < ESTF) return ['微調', 'flat']; return r.pct > 0 ? ['上修', 'up'] : ['下修', 'down']; }
function paintEstPx(code){
  const q = EHQ; if (!q) return;
  const e = $('#ehpx'); if (e) e.innerHTML = `<b class="big ${cls(q.c)}" style="font-size:24px">${fp(q.p)}</b> ${pct(q.c)} <span class="sub">${esc(q.t || '')}</span>`;
  $$('[data-after]').forEach(el => { const c0 = +el.dataset.after; if (c0 && q.p) el.innerHTML = `之後 ${pct(Math.round((q.p / c0 - 1) * 1000) / 10)}`; });
}
function paintEst(code){
  const d = EH, M = $('#main'); if (!d || VIEW !== 'est') return;
  $('#ttl').textContent = code + ' ' + (d.name || sname(code));
  const f = SUB.ehf || 'all';
  const rows = d.rows.filter(r => f === 'all' || estKind(r)[1] !== 'flat');
  const by = {}; rows.forEach(r => (by[r.d] = by[r.d] || []).push(r));
  const days = Object.keys(by).sort().reverse();
  // 一句話：近 30 天、全部期間的上修／下修次數
  const cut = +new Date(Date.now() - 30 * 86400000 + 8 * 3600e3).toISOString().slice(0, 10).replace(/-/g, '');
  const cnt = arr => { const o = {up: 0, down: 0}; arr.forEach(r => { const k = estKind(r)[1]; if (k !== 'flat') o[k]++; }); return o; };
  const all = cnt(d.rows), m1 = cnt(d.rows.filter(r => r.d >= cut));
  const vd = m1.up && !m1.down ? '🔺 近 30 天法人一路上修' : m1.down && !m1.up ? '🔻 近 30 天法人一路下修' : m1.up || m1.down ? (m1.up > m1.down ? '↗️ 近 30 天上修多於下修' : m1.up < m1.down ? '↘️ 近 30 天下修多於上修' : '↔️ 近 30 天上下互見') : '近 30 天沒有上下修';
  let h = `<div class="card"><div style="display:flex;align-items:flex-end;gap:8px"><div id="ehpx" class="m0">${loading('')}</div></div>
    <div class="verdict">${vd}（上修 ${m1.up}・下修 ${m1.down}）<br><span class="sub">有紀錄以來（${d.first ? ymd8(d.first) : '—'} 起）：上修 ${all.up} 次・下修 ${all.down} 次</span></div>
    <div class="btns" style="margin-top:10px"><button class="btn sm" data-code="${esc(code)}">📈 K 線＋籌碼</button><button class="btn sm g" id="ehR">📑 一鍵報告</button></div></div>`;
  h += `<div class="card" id="repcard"></div>`;
  h += `<div class="tabsm"><button data-ef="all" class="${f === 'all' ? 'on' : ''}">全部紀錄</button><button data-ef="chg" class="${f === 'chg' ? 'on' : ''}">只看上修／下修</button></div>`;
  h += days.map(dd => { const a = by[dd], c0 = a.find(r => r.close) || {};
    return `<div class="card tl"><h3>${ymd8(dd)} <span class="sub" style="font-weight:400">${String(dd).slice(0, 4)}</span><span class="sub" style="margin-left:auto;font-weight:400">${c0.close ? '收 ' + fp(c0.close) + '・<span data-after="' + c0.close + '"></span>' : ''}</span></h3>
      ${a.sort((x, y) => y.y.localeCompare(x.y)).map(r => { const [t, k] = estKind(r);
        return `<div class="yr"><span class="sub">${esc(r.y)}</span><span>${r.prev != null ? fp(r.prev) + ' → ' : ''}<b>${fp(r.eps)}</b></span><span class="pill ${k}">${t}${r.pct != null && !r.init ? ' ' + sgn(r.pct) + fp(r.pct) + '%' : ''}</span></div>`; }).join('')}</div>`; }).join('') || `<div class="empty">${d.rows.length ? '這段期間只有微調' : '法人預估紀錄裡還沒有這檔（紀錄從自動抓取開始那天起）'}</div>`;
  if (d.rows.length > 1) h += `<div class="card"><h3>📈 各年度 EPS 預估變化</h3><div class="legend" id="ehlg"></div><div class="chart s" id="ehc"></div></div>`;
  M.innerHTML = h;
  bindCodes(M);
  $('#ehR').onclick = () => { if (!repPend(code)) doReport(code); };
  $$('[data-ef]').forEach(b => b.onclick = () => { SUB.ehf = b.dataset.ef; saveSub(); paintEst(code); });
  paintRep(code);
  if (EHQ) paintEstPx(code); else { const e = $('#ehpx'); if (e) e.innerHTML = '<span class="sub">讀取現價…</span>'; }
  if (d.rows.length > 1) loadCharts().then(() => {
    const el = $('#ehc'); if (!el || VIEW !== 'est') return;
    const ch = mkChart(el), cols = ['#e8590c', '#1c7ed6', '#2f9e44', '#7048e8'];
    const ys = [...new Set(d.rows.map(r => r.y))].sort().reverse().slice(0, 4);
    $('#ehlg').innerHTML = ys.map((y, i) => `<span style="--c:${cols[i]}">${esc(y)}</span>`).join('');
    ys.forEach((y, i) => { const pts = d.rows.filter(r => r.y === y).slice().reverse(); const seen = {};
      const data = pts.map(r => ({time: String(r.d).slice(0, 4) + '-' + String(r.d).slice(4, 6) + '-' + String(r.d).slice(6), value: r.eps})).filter(x => !seen[x.time] && (seen[x.time] = 1));
      const sr = ch.addLineSeries({color: cols[i], lineWidth: 2, lineType: 1, priceLineVisible: false}); sr.setData(data); });
    ch.timeScale().fitContent();
  }).catch(() => {});
}

  modal('從小幫手匯入', `<div class="sub">勾選要匯入的持股（會記成一筆「買進」，手續費自動估算）。已經在 App 記過的不要重複勾。</div>
    ${list.map((x, i) => `<label style="display:flex;gap:10px;align-items:center;color:var(--tx);font-size:15px;margin:12px 0"><input type="checkbox" data-i="${i}" checked style="width:20px;height:20px">${cn(x.code, x.name)}・${fmt(x.lots)} 張 @ ${fp(x.price)}${x.user ? ' <span class="sub">' + esc(String(x.user).slice(0, 6)) + '</span>' : ''}</label>`).join('')}
    <button class="btn" id="go" style="width:100%">匯入</button>`, (m, close) => {
    $('#go', m).onclick = async () => {
      const s = (ls.get('home', {}) || {});
      const rows = $$('[data-i]', m).filter(c => c.checked).map(c => { const x = list[+c.dataset.i]; const sh = Math.round(x.lots * 1000); return {type: '買進', code: x.code, name: x.name, sh, price: x.price, fee: calcFee(sh * x.price), tax: 0, d: x.buyDate || today(), note: '從小幫手匯入'}; });
      try { const n = await call('txBatch', {rows}); close(); toast('✅ 匯入 ' + n + ' 筆'); go('book'); } catch(e){ toast(e.message, 4000); }
    };
  });
}
let SET = ls.get('set', {feeDisc: '0.6', minFee: '20'});
const calcFee = amt => amt > 0 ? Math.max(+SET.minFee || 0, Math.floor(amt * 0.001425 * (+SET.feeDisc || 1))) : 0;
const calcTax = (code, amt) => Math.floor(amt * (/^00/.test(code) ? 0.001 : 0.003));
async function txForm(t, after){
  const map = await smap();
  const edit = t && t.id;
  const st = Object.assign({type: '買進', code: '', name: '', sh: '', price: '', fee: '', tax: '', d: today(), note: '', amount: ''}, t || {});
  if (st.type === '現金股利' && edit) st.amount = st.net + st.fee;
  let unit = st.sh && st.sh % 1000 === 0 ? 1000 : (edit ? 1 : 1000);
  modal(edit ? '編輯交易' : '記一筆交易', `
    <div class="seg" id="tt">${['買進', '賣出', '現金股利', '股票股利'].map(x => `<button data-t="${x}">${x}</button>`).join('')}</div>
    <label>股票</label><div class="search" style="margin:0"><input id="tc" value="${st.code ? esc(st.code + ' ' + (st.name || map[st.code] || '')) : ''}" placeholder="股號或股名" autocomplete="off"><div class="sugg" id="ts" hidden></div></div>
    <div id="qw"><label>數量</label><div style="display:flex;gap:8px"><input id="tq" inputmode="decimal" value="${st.sh ? st.sh / unit : ''}" style="flex:1"><div class="seg" style="margin:0;width:120px" id="tu"><button data-u="1000">張</button><button data-u="1">股</button></div></div></div>
    <div id="pw"><label>成交價</label><input id="tp" inputmode="decimal" value="${esc(st.price || '')}"></div>
    <div id="aw" hidden><label>入帳金額（現金股利）</label><input id="ta" inputmode="decimal" value="${esc(st.amount || '')}"></div>
    <div class="grid2" style="margin-top:0" id="fw"><div><label>手續費（自動算，可改）</label><input id="tf" inputmode="decimal" value="${esc(st.fee)}"></div><div id="txw"><label>交易稅</label><input id="tx" inputmode="decimal" value="${esc(st.tax)}"></div></div>
    <div class="grid2" style="margin-top:0"><div><label>日期</label><input type="date" id="td" value="${esc(st.d)}"></div><div><label>備註</label><input id="tn" value="${esc(st.note)}" placeholder="選填"></div></div>
    <div class="kv" style="margin-top:12px"><span class="sub">淨收付</span><b id="tnet">—</b></div>
    <div class="btns" style="margin-top:14px"><button class="btn" id="tsv" style="flex:1">儲存</button>${edit ? '<button class="btn red" id="tdl">刪除</button>' : ''}</div>`, (m, close) => {
    let feeTouched = !!edit, taxTouched = !!edit;
    const code = () => (($('#tc', m).value.trim().match(/^\d{4,6}[A-Z]?/i) || [''])[0]).toUpperCase();
    const qty = () => Math.round((+$('#tq', m).value || 0) * unit);
    const recalc = () => {
      const sh = qty(), p = +$('#tp', m).value || 0, amt = Math.round(sh * p);
      if (!feeTouched) $('#tf', m).value = st.type === '買進' || st.type === '賣出' ? calcFee(amt) : (st.type === '現金股利' ? 10 : 0);
      if (!taxTouched) $('#tx', m).value = st.type === '賣出' ? calcTax(code(), amt) : 0;
      const fee = +$('#tf', m).value || 0, tax = +$('#tx', m).value || 0;
      const net = st.type === '買進' ? -(amt + fee) : st.type === '賣出' ? amt - fee - tax : st.type === '現金股利' ? (+$('#ta', m).value || 0) - fee : 0;
      $('#tnet', m).innerHTML = money(net);
    };
    const paint = () => {
      $$('#tt button', m).forEach(b => b.classList.toggle('on', b.dataset.t === st.type));
      $$('#tu button', m).forEach(b => b.classList.toggle('on', +b.dataset.u === unit));
      $('#qw', m).hidden = st.type === '現金股利'; $('#pw', m).hidden = st.type === '現金股利' || st.type === '股票股利';
      $('#aw', m).hidden = st.type !== '現金股利'; $('#txw', m).hidden = st.type !== '賣出'; $('#fw', m).hidden = st.type === '股票股利';
      recalc();
    };
    $$('#tt button', m).forEach(b => b.onclick = () => { st.type = b.dataset.t; feeTouched = taxTouched = false; paint(); });
    $$('#tu button', m).forEach(b => b.onclick = () => { const sh = qty(); unit = +b.dataset.u; $('#tq', m).value = sh ? sh / unit : ''; paint(); });
    ['#tq', '#tp', '#ta'].forEach(s => $(s, m).oninput = recalc);
    $('#tf', m).oninput = () => { feeTouched = true; recalc(); }; $('#tx', m).oninput = () => { taxTouched = true; recalc(); };
    const tc = $('#tc', m), ts = $('#ts', m);
    tc.oninput = () => {
      const q = tc.value.trim().toUpperCase(); if (!q){ ts.hidden = true; return; }
      const out = []; for (const c in map){ if (c.indexOf(q) === 0 || map[c].toUpperCase().indexOf(q) >= 0) out.push(c); if (out.length > 20) break; }
      ts.innerHTML = out.slice(0, 6).map(c => `<div data-c="${esc(c)}">${cn(c, map[c])}</div>`).join(''); ts.hidden = !out.length;
      $$('[data-c]', ts).forEach(el => el.onclick = () => { tc.value = el.dataset.c + ' ' + map[el.dataset.c]; ts.hidden = true; recalc(); });
    };
    paint();
    $('#tsv', m).onclick = async () => {
      const c = code(); if (!c) return toast('請選股票');
      const a = {id: edit ? t.id : '', type: st.type, code: c, name: map[c] || st.name || '', sh: qty(), price: +$('#tp', m).value || 0, fee: +$('#tf', m).value || 0,
        tax: +$('#tx', m).value || 0, amount: +$('#ta', m).value || 0, d: $('#td', m).value, note: $('#tn', m).value};
      if (st.type === '現金股利') a.sh = 0;
      $('#tsv', m).disabled = true;
      try { await call('txSave', a); close(); toast('✅ 已儲存'); ls.set('home', null); if (after) after(); }
      catch(x){ toast(x.message, 3500); $('#tsv', m).disabled = false; }
    };
    if (edit) $('#tdl', m).onclick = async () => { if (!(await confirmBox('刪除這筆交易？'))) return; try{ await call('txDel', {id: t.id}); close(); toast('已刪除'); if (after) after(); }catch(x){ toast(x.message); } };
  });
}

// ====================== 資產 ======================
async function vAsset(){
  const M = $('#main');
  M.innerHTML = loading();
  let d; try { d = await call('assets'); } catch(e){ M.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if (VIEW !== 'asset') return;
  const asA = d.accounts.filter(a => a.kind !== '負債'), liA = d.accounts.filter(a => a.kind === '負債');
  const acRow = a => `<div class="row" data-ac="${esc(a.id)}"><div class="l"><div class="nm">${esc(a.name)}${a.name === d.settle ? '<span class="tag">股票交割</span>' : ''}</div><div class="sub">${esc(a.cat || a.kind)}${a.note ? '・' + esc(a.note) : ''}</div></div><div class="r"><b class="m">${fmt(a.bal)}</b></div></div>`;
  let h = `<div class="card"><div class="sub">淨資產＝現金存款＋股票市值－負債</div><div class="big">${mk(fmt(d.net))}</div>
    <div class="grid3"><div class="kv"><span class="sub">現金存款</span><b>${mk(fmt(d.cash))}</b></div><div class="kv"><span class="sub">股票</span><b>${mk(fmt(d.stock))}</b></div><div class="kv"><span class="sub">負債</span><b>${mk(fmt(d.debt))}</b></div></div></div>`;
  h += `<div class="card"><h3>📈 淨資產走勢<button class="more" id="snap">記錄今天</button></h3>${d.snaps.length > 1 ? '<div class="chart s mchart" id="nc"></div>' : '<div class="empty">每天下午 2:40 自動記一筆，累積幾天就會出現走勢圖</div>'}</div>`;
  h += `<div class="card"><h3>🏦 資產帳戶</h3>${asA.map(acRow).join('') || '<div class="empty">沒有帳戶</div>'}<div class="row" id="gostk"><div class="l nm">📊 股票市值</div><div class="r"><b class="m">${fmt(d.stock)}</b></div></div></div>`;
  h += `<div class="card"><h3>💳 負債</h3>${liA.map(acRow).join('') || '<div class="empty">沒有負債帳戶（信用卡、貸款可以加在這）</div>'}</div>`;
  h += `<div class="sub" style="padding:0 4px 12px">💡 帳戶餘額＝你最後一次「校正」的金額＋之後新記的收支／轉帳（補記校正日以前的舊帳不會重複算）${d.settle ? '＋股票買賣（交割帳戶）' : ''}。跟銀行對不上時，點帳戶 → 校正成銀行 App 上的數字就好。</div>`;
  M.innerHTML = h;
  fab(() => acForm(null));
  $$('[data-ac]').forEach(el => el.onclick = () => acForm(d.accounts.find(a => a.id === el.dataset.ac)));
  $('#gostk').onclick = () => go('home');
  $('#snap').onclick = async () => { try{ await call('snapNow'); toast('✅ 已記錄'); vAsset(); }catch(e){ toast(e.message); } };
  if (d.snaps.length > 1) loadCharts().then(() => {
    if (VIEW !== 'asset' || !$('#nc')) return;
    const c = C(); const ch = mkChart($('#nc'));
    ch.applyOptions({localization: {locale: 'zh-TW', dateFormat: 'yyyy/MM/dd', priceFormatter: v => (v / 10000).toFixed(v >= 1e6 ? 0 : 1) + '萬'}});
    const s = ch.addAreaSeries({lineColor: c.pri, topColor: c.pri + '55', bottomColor: c.pri + '05', lineWidth: 2, priceLineVisible: false});
    s.setData(d.snaps.map(x => ({time: x.d, value: x.net}))); ch.timeScale().fitContent();
  }).catch(() => {});
}
function acForm(a){
  const st = Object.assign({name: '', kind: '資產', cat: '銀行', note: '', bal: ''}, a || {});
  const cats = {資產: ['現金', '銀行', '證券交割', '外幣', '電子支付', '定存', '保單', '其他'], 負債: ['信用卡', '房貸', '信貸', '車貸', '其他']};
  modal(a ? '帳戶：' + a.name : '新增帳戶', `
    ${a ? `<div class="kv"><span class="sub">目前餘額（App 算的）</span><b class="mid">${fmt(a.bal)}</b></div>
      <label>校正餘額（輸入銀行／信用卡 App 上的實際金額${a.kind === '負債' ? '，欠款填正數' : ''}）</label><div style="display:flex;gap:8px"><input id="cb" inputmode="decimal" placeholder="${a.bal}"><button class="btn" id="cbs" style="white-space:nowrap">校正</button></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0 4px">` : ''}
    <div class="seg" id="ak" style="margin-top:10px"><button data-k="資產">資產</button><button data-k="負債">負債</button></div>
    <label>名稱</label><input id="an" value="${esc(st.name)}" placeholder="例如：玉山銀行、國泰信用卡">
    <label>類別</label><div class="chips" id="acat"></div>
    ${a ? '' : `<label>目前餘額${st.kind === '負債' ? '（欠款）' : ''}</label><input id="ab" inputmode="decimal" placeholder="0">`}
    <label>備註</label><input id="ano" value="${esc(st.note)}" placeholder="選填">
    <div class="btns" style="margin-top:16px"><button class="btn" id="as" style="flex:1">儲存</button>${a ? '<button class="btn red" id="adl">刪除</button>' : ''}</div>`, (m, close) => {
    const paint = () => {
      $$('#ak button', m).forEach(b => b.classList.toggle('on', b.dataset.k === st.kind));
      if (cats[st.kind].indexOf(st.cat) < 0) st.cat = cats[st.kind][0];
      $('#acat', m).innerHTML = cats[st.kind].map(c => `<button class="${c === st.cat ? 'on' : ''}">${c}</button>`).join('');
      $$('#acat button', m).forEach(b => b.onclick = () => { st.cat = b.textContent; paint(); });
    };
    $$('#ak button', m).forEach(b => b.onclick = () => { st.kind = b.dataset.k; paint(); }); paint();
    $('#as', m).onclick = async () => {
      const x = {id: a && a.id, name: $('#an', m).value, kind: st.kind, cat: st.cat, note: $('#ano', m).value};
      if (!a) x.base = +$('#ab', m).value || 0;
      try { await call('acSave', x); close(); toast('✅ 已儲存'); vAsset(); } catch(e){ toast(e.message, 3500); }
    };
    if (a){
      $('#cbs', m).onclick = async () => { const v = $('#cb', m).value; if (v === '') return toast('請輸入金額'); try{ await call('acCalibrate', {id: a.id, balance: +v}); close(); toast('✅ 已校正'); vAsset(); }catch(e){ toast(e.message); } };
      $('#adl', m).onclick = async () => { if (!(await confirmBox('刪除帳戶「' + a.name + '」？（收支紀錄會保留）'))) return; try{ await call('acDel', {id: a.id}); close(); vAsset(); }catch(e){ toast(e.message); } };
    }
  });
}

// ====================== 設定 ======================

  const close0 = modal('設定', loading());
  let s; try { s = await call('settings'); } catch(e){ close0(); return toast(e.message, 4000); }
  close0();
  SET = s.set; ls.set('set', SET);
  modal('設定', `
    <h3 style="margin:8px 0 6px">✅ 還有什麼沒做</h3><div id="stChk">${loading('檢查中…')}</div>
    <h3 style="margin:18px 0 0">🔗 LINE 股票檔案小幫手</h3>
    <div class="sub">連結後才能一鍵做報告、看券商明細和小助理。最簡單：在 LINE 傳「連結Atlas」給小幫手 → 拷貝它回的連結 → 按下面按鈕。</div>
    <button class="btn" id="spl" style="width:100%;margin-top:8px">📋 貼上小幫手連結</button>
    <label>小幫手網址（結尾 /exec）</label><input id="su" value="${esc(s.botUrl)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label>KEY（小幫手指令碼屬性的 SCRAPE_KEY）${s.hasBotKey ? ' ✅已填' : ''}</label><input id="sk" type="password" placeholder="${s.hasBotKey ? '已填，要換才輸入' : '貼上 KEY'}">
    <label>FinMind token（選填，K 線／籌碼較不會被限流）${s.hasFinmind ? ' ✅已填' : ''}</label><input id="sf" type="password" placeholder="${s.hasFinmind ? '已填，要換才輸入' : '貼上 token'}">
    <div class="btns" style="margin-top:8px"><button class="btn sm g" id="stb">測試小幫手連線</button></div>
    <h3 style="margin:18px 0 0">📈 股票交易</h3>
    <div class="grid2" style="margin-top:0"><div><label>手續費折數</label><input id="sd" inputmode="decimal" value="${esc(s.set.feeDisc)}"></div><div><label>最低手續費</label><input id="sm" inputmode="decimal" value="${esc(s.set.minFee)}"></div></div>
    <label>股票交割帳戶（買股票自動從這裡扣錢）</label><select id="sa"><option value="">（不連動）</option>${s.accounts.map(a => `<option ${a.name === s.set.settleAccount ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
    <h3 style="margin:18px 0 0">🧾 記帳分類（用逗號分開）</h3>
    <label>支出</label><textarea id="se" rows="3">${esc(s.set.expCats)}</textarea>
    <label>收入</label><textarea id="si" rows="2">${esc(s.set.incCats)}</textarea>
    <div class="btns" style="margin-top:16px"><button class="btn" id="ss" style="flex:1">儲存</button></div>
    <div class="sub" style="margin-top:16px">${s.dataUrl ? `📄 <a href="${esc(s.dataUrl)}" target="_blank">打開記帳資料試算表</a>（可以直接在裡面改）<br>` : ''}
    排程：${s.triggers.length ? esc(s.triggers.join('、')) : '<b>還沒建立</b> <button class="btn sm g" id="sinit">建立</button>'}<br>版本 ${esc(s.ver)}</div>`, (m, close) => {
    $('#spl', m).onclick = async () => { let t = ''; try { t = await navigator.clipboard.readText(); } catch(e){ return linkGuide(); } const c = parseBotLink(t); if (!c) return linkGuide();
      try { await saveBotLink(c); close(); openSettings(); } catch(e){ toast('❌ ' + e.message, 4500); } };
    call('setupStatus').then(st => { const el = $('#stChk', m); if (!el) return;
      el.innerHTML = st.items.map(x => `<div class="row"><div style="font-size:18px">${x.ok ? '✅' : x.opt ? '⚪' : '⚠️'}</div><div class="l"><div class="nm" style="white-space:normal">${esc(x.title)}</div><div class="sub">${esc(x.how)}</div></div></div>`).join('');
      if (st.items[0] && st.items[0].ok) ls.set('hasBot', true); }).catch(e => { const el = $('#stChk', m); if (el) el.innerHTML = `<div class="err">${esc(e.message)}</div>`; });
    $('#stb', m).onclick = async () => { await save(false); try{ const r = await call('testBot'); toast('✅ 連上小幫手 ' + (r.v || '')); }catch(e){ toast('❌ ' + e.message, 4500); } };
    const save = async (doClose) => {
      const a = {botUrl: $('#su', m).value.trim(), feeDisc: $('#sd', m).value, minFee: $('#sm', m).value, settleAccount: $('#sa', m).value, expCats: $('#se', m).value, incCats: $('#si', m).value};
      if ($('#sk', m).value) a.botKey = $('#sk', m).value; if ($('#sf', m).value) a.finmind = $('#sf', m).value;
      try { const r = await call('saveSettings', a); SET = r.set; ls.set('set', SET); if (doClose){ close(); toast('✅ 已儲存'); go(VIEW); } } catch(e){ toast(e.message, 4000); throw e; }
    };
    $('#ss', m).onclick = () => save(true).catch(() => {});
    const si = $('#sinit', m); if (si) si.onclick = async () => { try{ await call('init'); toast('✅ 已建立'); close(); openSettings(); }catch(e){ toast(e.message); } };
  });
}

applyPriv();

  if (bl){ try { history.replaceState(null, '', location.pathname); } catch(e){} saveBotLink(bl).catch(e => toast('❌ 連結小幫手失敗：' + e.message, 4500)); }
