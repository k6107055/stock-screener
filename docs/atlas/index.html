<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Atlas</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://unpkg.com">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--tx:#1d2129;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--pri2:#dbeafe;
  --up:#e03131;--down:#16a34a;--upbg:#fff0f0;--downbg:#ecfdf3;--warn:#b45309;--warnbg:#fff7e6;
  --r:14px;--nav:64px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#1a1d24;--tx:#e8eaed;--sub:#9aa0aa;--line:#2a2e37;--pri:#60a5fa;--pri2:#1e3a5f;
  --up:#ff6b6b;--down:#34d399;--upbg:#3a1d1f;--downbg:#123026;--warn:#fbbf24;--warnbg:#3a2e12;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding-bottom:calc(var(--nav) + 24px)}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
header h1{font-size:20px;margin:0;flex:1}
.ib{border:0;background:var(--card);color:var(--tx);width:38px;height:38px;border-radius:50%;font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
main{padding:0 12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--pri);font-weight:400;background:none;border:0;padding:0}
.sub{color:var(--sub);font-size:12.5px}
.big{font-size:30px;font-weight:700;letter-spacing:.3px}
.mid{font-size:19px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.kv{background:var(--bg);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:15px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{flex:1;min-width:0}
.row .r{text-align:right}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--pri2);color:var(--pri);margin-left:4px;vertical-align:1px;font-weight:500}
.tag.h{background:var(--upbg);color:var(--up)}
.tag.w{background:var(--warnbg);color:var(--warn)}
.pill{display:inline-block;padding:2px 8px;border-radius:8px;font-weight:600;font-size:13px}
.pill.up{background:var(--upbg)}.pill.down{background:var(--downbg)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom),10px)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:600}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--sub);padding:8px 4px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;background:var(--pri);color:#fff;font-weight:600}
.btn.g{background:var(--bg);color:var(--tx)}
.btn.red{background:var(--up)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + 26px);z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(37,99,235,.4)}
.mask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center}
.sheet h2 .x{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:16px;padding:6px 11px;font-size:13.5px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.amt{font-size:28px;font-weight:700;text-align:right}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:80;background:rgba(20,20,20,.88);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center}
.load{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--sub);padding:30px 0}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.chart{height:300px;margin:0 -6px}
.chart.s{height:170px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--pri);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--sub);font-weight:500;border-top:0}
td:first-child,th:first-child{text-align:left}
.scrollx{overflow-x:auto;margin:0 -4px}
.art{padding:10px 0;border-top:1px solid var(--line)}
.art:first-child{border-top:0}
.art a{color:var(--tx);text-decoration:none;font-weight:600}
.art p{margin:4px 0 0;color:var(--sub);font-size:13.5px}
a{color:var(--pri)}
.search{position:relative;margin-bottom:12px}
.sugg{position:absolute;left:0;right:0;top:46px;z-index:15;background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden}
.sugg div{padding:11px 14px;border-top:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:3px}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
.dayh{font-size:12.5px;color:var(--sub);padding:10px 0 2px;display:flex}
.dayh span{margin-left:auto}
.spark{width:100%;height:46px;display:block;margin-top:8px}
.tabsm{display:flex;gap:6px;margin:6px 0}
.tabsm button{border:0;background:var(--bg);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:12.5px}
.tabsm button.on{background:var(--pri2);color:var(--pri);font-weight:600}
body.priv .m{color:transparent!important;background:var(--line);border-radius:6px;user-select:none;-webkit-user-select:none}
body.priv .m *{color:transparent!important;background:transparent!important}
body.priv .m svg,body.priv .mchart{visibility:hidden}
.ltabs{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 10px;padding:0 12px;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:18px;padding:7px 13px;font-size:14px}
.ltabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.ed{display:flex;gap:6px}.ed button{border:0;background:var(--bg);color:var(--tx);width:36px;height:34px;border-radius:9px;font-size:16px}.ed .rm{color:var(--up)}
.sr{display:flex;align-items:center;gap:8px}.sr span{flex:1}.sr .add{border:0;background:var(--pri);color:#fff;width:34px;height:30px;border-radius:9px;font-size:18px;line-height:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;font-size:14px}
table.bk td,table.bk th{text-align:center;position:relative}
table.bk td.bv,table.bk td.av{font-size:12.5px;color:var(--sub)}
table.bk td i{position:absolute;top:3px;bottom:3px;opacity:.18;border-radius:3px}
table.bk td.bv i{right:0;background:var(--up)}table.bk td.av i{left:0;background:var(--down)}
@keyframes fu{0%{background:var(--upbg)}100%{background:transparent}}@keyframes fd{0%{background:var(--downbg)}100%{background:transparent}}
.fu{animation:fu 1.2s ease-out}.fd{animation:fd 1.2s ease-out}
label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px;margin:12px 0}label.ck input{width:22px;height:22px}
.sugg div.sr{padding:9px 10px 9px 14px}
body:not(.priv) .privhint{display:none}
</style>
</head>
<body>
<header><h1 id="ttl">Atlas</h1><button class="ib" id="btnEye" title="顯示／隱藏金額">🙈</button><button class="ib" id="btnRef" title="重新整理">↻</button><button class="ib" id="btnSet" title="設定">⚙️</button></header>
<main id="main"></main>
<nav id="nav">
  <button data-v="home" class="on"><i>🏠</i>首頁</button>
  <button data-v="stock"><i>📈</i>自選</button>
  <button data-v="info"><i>📰</i>資訊</button>
  <button data-v="book"><i>📝</i>記帳</button>
  <button data-v="asset"><i>💰</i>資產</button>
</nav>
<script>
// ====================== 基本工具 ======================
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('zh-TW', {minimumFractionDigits: d || 0, maximumFractionDigits: d == null ? 0 : d});
const fp = n => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('zh-TW', {maximumFractionDigits: 2});
const sgn = n => n > 0 ? '+' : '';
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';
const money = n => `<span class="${cls(n)}">${sgn(n)}${fmt(n)}</span>`;
const pct = n => n == null ? '<span class="sub">—</span>' : `<span class="${cls(n)}">${sgn(n)}${fp(n)}%</span>`;
const ymd8 = d => { d = String(d); return d.length === 8 ? d.slice(4, 6) + '/' + d.slice(6) : d.slice(5).replace('-', '/'); };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const shTxt = sh => sh % 1000 === 0 ? fmt(sh / 1000) + ' 張' : (sh >= 1000 ? fmt(Math.floor(sh / 1000)) + ' 張 ' + fmt(sh % 1000) + ' 股' : fmt(sh) + ' 股');
const ls = { get(k, d){ try{ const v = localStorage.getItem('ma_' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
             set(k, v){ try{ localStorage.setItem('ma_' + k, JSON.stringify(v)); }catch(e){} } };
// ====================== 配對（伺服器網址＋金鑰，只存在這支手機）======================
let CFG = (() => { try { return JSON.parse(localStorage.getItem('atlas_cfg') || 'null'); } catch(e){ return null; } })();
function readPair(str){
  const i = String(str || '').indexOf('#'); if (i < 0) return null;
  const h = new URLSearchParams(String(str).slice(i + 1)); const u = h.get('u'), k = h.get('k');
  return u && k && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) && /^[0-9a-f]{32,}$/.test(k) ? {u, k} : null;
}
(function(){ const c = readPair(location.href); if (c){ CFG = c; try{ localStorage.setItem('atlas_cfg', JSON.stringify(c)); }catch(e){} } })();
const loading = (t) => `<div class="load"><div class="spin"></div>${esc(t || '載入中…')}</div>`;
function toast(t, ms){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), ms || 2200); }
async function call(op, args){
  if (window.__testApi) return window.__testApi(op, args || {});
  if (!CFG) throw new Error('尚未配對');
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  let r;
  try { r = await fetch(CFG.u, {method: 'POST', body: JSON.stringify({k: CFG.k, op, args: args || {}}), headers: {'Content-Type': 'text/plain;charset=utf-8'}, signal: ctl.signal, credentials: 'omit', cache: 'no-store'}); }
  catch(e){ throw new Error(e.name === 'AbortError' ? '連線逾時，請再試一次' : '網路連不上，請檢查網路'); }
  finally { clearTimeout(t); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('伺服器忙線（' + r.status + '），請再試一次'); }
  if (!j.ok && j.error === 'AUTH'){ pairScreen('金鑰不對或已更換，請用新的配對連結'); throw new Error('需要重新配對'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function pairScreen(msg){
  VIEW = 'pair'; clearInterval(TIMER); clearInterval(POLL);
  $('#ttl').textContent = 'Atlas';
  $('#main').innerHTML = `<div class="card"><h3>🔐 第一次使用：配對這支手機</h3>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <p class="sub">把「配對連結」整串貼在下面（Claude 給你的那條 https://…/atlas/#u=…&k=…），按配對。配對資料只存在這支手機。</p>
    <textarea id="pl" rows="4" style="width:100%;font-size:14px" placeholder="https://k6107055.github.io/stock-screener/atlas/#u=…&k=…"></textarea>
    <button class="btn" id="pb" style="width:100%;margin-top:10px">配對</button></div>`;
  $('#pb').onclick = async () => {
    const c = readPair($('#pl').value.trim());
    if (!c) return toast('連結格式不對，請整串貼上', 3000);
    CFG = c; try{ localStorage.setItem('atlas_cfg', JSON.stringify(c)); }catch(e){}
    $('#pb').textContent = '確認中…';
    try { await call('ping'); toast('✅ 配對成功'); go('home'); } catch(e){ if (CFG) toast(e.message, 3500); $('#pb').textContent = '配對'; }
  };
}
const C = () => { const s = getComputedStyle(document.documentElement); const g = k => s.getPropertyValue(k).trim(); return {up:g('--up'), down:g('--down'), tx:g('--tx'), sub:g('--sub'), line:g('--line'), card:g('--card'), pri:g('--pri')}; };

// ====================== 股票清單（搜尋用）======================
let SMAP = ls.get('smap', null);
async function smap(){
  if (SMAP && SMAP.t && Date.now() - SMAP.t < 3 * 86400000) return SMAP.m;
  try { const m = await call('stockMap'); SMAP = {t: Date.now(), m}; ls.set('smap', SMAP); return m; } catch(e){ return (SMAP && SMAP.m) || {}; }
}
const sname = c => (SMAP && SMAP.m && SMAP.m[c]) || '';
const cn = (c, n) => `${esc(c)} ${esc(n || sname(c))}`;

// ====================== 導覽（記住上次離開的頁面）======================
let VIEW = 'home', SUB = ls.get('sub', {}), TIMER = null, POLL = null;
const TITLES = {home:'Atlas', stock:'自選', info:'資訊', book:'記帳', asset:'資產'};
function go(v, arg){
  VIEW = v; $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#ttl').textContent = TITLES[v] || 'Atlas';
  clearInterval(TIMER); TIMER = null; clearInterval(POLL); POLL = null; destroyCharts();
  const f = Fab(); if (f) f.remove();
  window.scrollTo(0, 0);
  if (v !== 'stock') SUB.code = null;
  ls.set('last', {v, arg: arg || null}); ls.set('sub', SUB);
  ({home: vHome, stock: vStock, info: vInfo, book: vBook, asset: vAsset})[v](arg);
}
const saveSub = () => ls.set('sub', SUB);
const Fab = () => $('.fab');
$$('#nav button').forEach(b => b.onclick = () => go(b.dataset.v));
$('#btnRef').onclick = () => { ls.set('home', null); go(VIEW, VIEW === 'stock' ? SUB.code : undefined); };
$('#btnSet').onclick = () => openSettings();
// 隱私：一打開金額都先遮住，按 👁 才顯示
let PRIV = true;
function applyPriv(){ document.body.classList.toggle('priv', PRIV); $('#btnEye').textContent = PRIV ? '🙈' : '👁'; }
$('#btnEye').onclick = () => { PRIV = !PRIV; applyPriv(); };
document.addEventListener('visibilitychange', () => { if (document.hidden){ PRIV = true; applyPriv(); } });
function fab(fn){ const b = document.createElement('button'); b.className = 'fab'; b.textContent = '+'; b.onclick = fn; document.body.appendChild(b); }

// ====================== 彈出視窗 ======================
function modal(title, html, onMount){
  const m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = `<div class="sheet"><h2>${esc(title)}<button class="ib x">✕</button></h2>${html}</div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  $('.x', m).onclick = close;
  if (onMount) onMount(m, close);
  return close;
}
function confirmBox(text){ return new Promise(r => { modal('確認', `<p>${esc(text)}</p><div class="btns"><button class="btn red ok">確定</button><button class="btn g no">取消</button></div>`, (m, close) => { $('.ok', m).onclick = () => { close(); r(true); }; $('.no', m).onclick = () => { close(); r(false); }; }); }); }

// ====================== 圖表（需要時才載入圖表程式，打開 App 比較快）======================
let CHARTS = [], LWC = null;
function loadCharts(){
  if (window.LightweightCharts) return Promise.resolve();
  if (LWC) return LWC;
  LWC = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js'; s.onload = res; s.onerror = () => { LWC = null; rej(new Error('圖表載入失敗')); }; document.head.appendChild(s); });
  return LWC;
}
function destroyCharts(){ CHARTS.forEach(c => { try{ c.remove(); }catch(e){} }); CHARTS = []; }
function mkChart(el, opt){
  const c = C();
  const ch = LightweightCharts.createChart(el, Object.assign({
    autoSize: true, layout: {background: {color: 'transparent'}, textColor: c.sub, fontSize: 11},
    grid: {vertLines: {visible: false}, horzLines: {color: c.line}},
    rightPriceScale: {borderVisible: false}, timeScale: {borderVisible: false},
    crosshair: {mode: 0}, localization: {locale: 'zh-TW', dateFormat: 'yyyy/MM/dd'},
    handleScale: {axisPressedMouseMove: false},
  }, opt || {}));
  CHARTS.push(ch); return ch;
}
function sma(arr, n){ const o = []; let s = 0; for (let i = 0; i < arr.length; i++){ s += arr[i]; if (i >= n) s -= arr[i - n]; o.push(i >= n - 1 ? Math.round(s / n * 100) / 100 : null); } return o; }
function spark(vals){
  vals = vals.filter(v => v != null); if (vals.length < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), w = 300, h = 46, d = mx - mn || 1;
  const pts = vals.map((v, i) => (i / (vals.length - 1) * w).toFixed(1) + ',' + (h - 3 - (v - mn) / d * (h - 6)).toFixed(1)).join(' ');
  const col = vals[vals.length - 1] >= vals[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="2" points="${pts}" vector-effect="non-scaling-stroke"/></svg>`;
}

function bindSearch(map){
  const inp = $('#q'), sg = $('#sugg'); if (!inp) return;
  inp.oninput = () => {
    const q = inp.value.trim().toUpperCase();
    if (!q){ sg.hidden = true; return; }
    const out = [];
    for (const c in map){ if (c.indexOf(q) === 0 || map[c].toUpperCase().indexOf(q) >= 0) out.push(c); if (out.length > 40) break; }
    out.sort((a, b) => (a.indexOf(q) === 0 ? 0 : 1) - (b.indexOf(q) === 0 ? 0 : 1) || a.length - b.length || (a < b ? -1 : 1));
    if (!out.length && /^\d{4,6}[A-Z]?$/.test(q)) out.push(q);
    const cur = curList(), canAdd = cur !== '__hold';
    sg.innerHTML = out.slice(0, 8).map(c => `<div class="sr" data-c="${esc(c)}"><span>${cn(c, map[c])}</span>${canAdd ? `<button class="add" data-add="${esc(c)}">＋</button>` : ''}</div>`).join('') || '<div class="sub">找不到</div>';
    sg.hidden = false;
    $$('[data-c]', sg).forEach(el => el.onclick = e => { if (e.target.closest('[data-add]')) return; go('stock', el.dataset.c); });
    $$('[data-add]', sg).forEach(b => b.onclick = async () => {
      const c = b.dataset.add; b.textContent = '…';
      try { const t = await call('listAdd', {list: cur, code: c}); b.textContent = '✓'; toast(cn(c, map[c]) + ' ' + t);
        const L = LISTS.lists.find(l => l.name === cur); if (L && L.codes.indexOf(c) < 0){ L.codes.push(c); LISTS.info[c] = LISTS.info[c] || {n: map[c]}; paintLists(); }
        refreshLists(); } catch(e){ b.textContent = '＋'; toast(e.message, 3500); }
    });
  };
  inp.onkeydown = e => { if (e.key === 'Enter'){ const f = $('[data-c]', sg); if (f) go('stock', f.dataset.c); } };
}
function promptBox(title, val, fn){
  modal(title, `<input id="pb" value="${esc(val)}"><div class="btns" style="margin-top:12px"><button class="btn" id="pok" style="flex:1">確定</button></div>`, (m, close) => {
    const i = $('#pb', m); setTimeout(() => i.focus(), 150);
    const ok = () => { const v = i.value.trim(); if (!v) return; close(); fn(v); };
    $('#pok', m).onclick = ok; i.onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}

function drawK(k, q, n){

  const t = k.t.slice(), o = k.o.slice(), hi = k.h.slice(), lo = k.l.slice(), cl = k.c.slice(), v = k.v.slice();
  if (q && q.d && q.price){ const td = q.d.slice(0, 4) + '-' + q.d.slice(4, 6) + '-' + q.d.slice(6);
    if (td > t[t.length - 1]){ t.push(td); o.push(q.o || q.price); hi.push(q.h || q.price); lo.push(q.l || q.price); cl.push(q.price); v.push(q.v || 0); }
    else if (td === t[t.length - 1]){ const i = t.length - 1; cl[i] = q.price; if (q.h) hi[i] = Math.max(hi[i], q.h); if (q.l) lo[i] = Math.min(lo[i], q.l); if (q.v) v[i] = q.v; } }

  ch.priceScale('v').applyOptions({scaleMargins: {top: 0.82, bottom: 0}});
  cs.priceScale().applyOptions({scaleMargins: {top: 0.05, bottom: 0.22}});

  ch.timeScale().setVisibleLogicalRange({from: t.length - (n || 132), to: t.length + 1});
}

    <label>類別</label><div class="chips" id="acat"></div>
    ${a ? '' : `<label>目前餘額${st.kind === '負債' ? '（欠款）' : ''}</label><input id="ab" inputmode="decimal" placeholder="0">`}
    <label>備註</label><input id="ano" value="${esc(st.note)}" placeholder="選填">
    <div class="btns" style="margin-top:16px"><button class="btn" id="as" style="flex:1">儲存</button>${a ? '<button class="btn red" id="adl">刪除</button>' : ''}</div>`, (m, close) => {
    const paint = () => {
      $$('#ak button', m).forEach(b => b.classList.toggle('on', b.dataset.k === st.kind));
      if (cats[st.kind].indexOf(st.cat) < 0) st.cat = cats[st.kind][0];
      $('#acat', m).innerHTML = cats[st.kind].map(c => `<button class="${c === st.cat ? 'on' : ''}">${c}</button>`).join('');
      $$('#acat button', m).forEach(b => b.onclick = () => { st.cat = b.textContent; paint(); });
    };
    $$('#ak button', m).forEach(b => b.onclick = () => { st.kind = b.dataset.k; paint(); }); paint();
    $('#as', m).onclick = async () => {
      const x = {id: a && a.id, name: $('#an', m).value, kind: st.kind, cat: st.cat, note: $('#ano', m).value};
      if (!a) x.base = +$('#ab', m).value || 0;
      try { await call('acSave', x); close(); toast('✅ 已儲存'); vAsset(); } catch(e){ toast(e.message, 3500); }
    };
    if (a){
      $('#cbs', m).onclick = async () => { const v = $('#cb', m).value; if (v === '') return toast('請輸入金額'); try{ await call('acCalibrate', {id: a.id, balance: +v}); close(); toast('✅ 已校正'); vAsset(); }catch(e){ toast(e.message); } };
      $('#adl', m).onclick = async () => { if (!(await confirmBox('刪除帳戶「' + a.name + '」？（收支紀錄會保留）'))) return; try{ await call('acDel', {id: a.id}); close(); vAsset(); }catch(e){ toast(e.message); } };
    }
  });
}

// ====================== 設定 ======================
async function openSettings(){
  const close0 = modal('設定', loading());
  let s; try { s = await call('settings'); } catch(e){ close0(); return toast(e.message, 4000); }
  close0();
  SET = s.set; ls.set('set', SET);
  modal('設定', `
    <h3 style="margin:8px 0 0">🔗 LINE 股票檔案小幫手</h3>
    <div class="sub">有填才看得到整合報告、券商明細、小助理、可以按鈕產生報告。</div>
    <label>小幫手網址（結尾 /exec）</label><input id="su" value="${esc(s.botUrl)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label>KEY（小幫手指令碼屬性的 SCRAPE_KEY）${s.hasBotKey ? ' ✅已填' : ''}</label><input id="sk" type="password" placeholder="${s.hasBotKey ? '已填，要換才輸入' : '貼上 KEY'}">
    <label>FinMind token（選填，K 線／籌碼較不會被限流）${s.hasFinmind ? ' ✅已填' : ''}</label><input id="sf" type="password" placeholder="${s.hasFinmind ? '已填，要換才輸入' : '貼上 token'}">
    <div class="btns" style="margin-top:8px"><button class="btn sm g" id="stb">測試小幫手連線</button></div>
    <h3 style="margin:18px 0 0">📈 股票交易</h3>
    <div class="grid2" style="margin-top:0"><div><label>手續費折數</label><input id="sd" inputmode="decimal" value="${esc(s.set.feeDisc)}"></div><div><label>最低手續費</label><input id="sm" inputmode="decimal" value="${esc(s.set.minFee)}"></div></div>
    <label>股票交割帳戶（買股票自動從這裡扣錢）</label><select id="sa"><option value="">（不連動）</option>${s.accounts.map(a => `<option ${a.name === s.set.settleAccount ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
    <h3 style="margin:18px 0 0">🧾 記帳分類（用逗號分開）</h3>
    <label>支出</label><textarea id="se" rows="3">${esc(s.set.expCats)}</textarea>
    <label>收入</label><textarea id="si" rows="2">${esc(s.set.incCats)}</textarea>
    <div class="btns" style="margin-top:16px"><button class="btn" id="ss" style="flex:1">儲存</button></div>
    <div class="sub" style="margin-top:16px">${s.dataUrl ? `📄 <a href="${esc(s.dataUrl)}" target="_blank">打開記帳資料試算表</a>（可以直接在裡面改）<br>` : ''}
    排程：${s.triggers.length ? esc(s.triggers.join('、')) : '<b>還沒建立</b> <button class="btn sm g" id="sinit">建立</button>'}<br>版本 ${esc(s.ver)}</div>`, (m, close) => {
    $('#stb', m).onclick = async () => { await save(false); try{ const r = await call('testBot'); toast('✅ 連上小幫手 ' + (r.v || '')); }catch(e){ toast('❌ ' + e.message, 4500); } };
    const save = async (doClose) => {
      const a = {botUrl: $('#su', m).value.trim(), feeDisc: $('#sd', m).value, minFee: $('#sm', m).value, settleAccount: $('#sa', m).value, expCats: $('#se', m).value, incCats: $('#si', m).value};
      if ($('#sk', m).value) a.botKey = $('#sk', m).value; if ($('#sf', m).value) a.finmind = $('#sf', m).value;
      try { const r = await call('saveSettings', a); SET = r.set; ls.set('set', SET); if (doClose){ close(); toast('✅ 已儲存'); go(VIEW); } } catch(e){ toast(e.message, 4000); throw e; }
    };
    $('#ss', m).onclick = () => save(true).catch(() => {});
    const si = $('#sinit', m); if (si) si.onclick = async () => { try{ await call('init'); toast('✅ 已建立'); close(); openSettings(); }catch(e){ toast(e.message); } };
  });
}

applyPriv();
(function boot(){
  if (!CFG && !window.__testApi) return pairScreen();
  const l = ls.get('last', null); try { if (l && TITLES[l.v]) return go(l.v, l.arg || undefined); } catch(e){} go('home'); })();
// 離線也能秒開：把畫面檔存在手機（新版本會在下次打開時自動換上）
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
