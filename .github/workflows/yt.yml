name: YouTube 財經筆記（Atlas）

on:
  schedule:
    # 台灣時間 07:30、19:30
    - cron: '30 23 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['yt/**', '.github/workflows/yt.yml']

permissions:
  contents: write

concurrency:
  group: atlas-yt
  cancel-in-progress: false

jobs:
  yt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 取回上次的資料（yt-data 分支）
        run: |
          mkdir -p yt-out
          if git fetch --depth 1 origin yt-data; then git archive FETCH_HEAD | tar -x -C yt-out; fi
      - name: 抓影片＋Gemini 決策卡
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python yt/fetch_yt_pipeline.py yt-out
      - name: 發佈到 yt-data 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd yt-out
          git init -q -b yt-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "YouTube 筆記 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" yt-data
