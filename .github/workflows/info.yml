name: 公開資訊觀測站（Atlas）

on:
  schedule:
    # 即時重大訊息：台灣時間 07:00～23:40 每 20 分鐘（GitHub 排程常會晚幾分鐘）
    - cron: '*/20 23,0-15 * * *'
    # 整套官方資料（轉讓申報、董監持股、公告…）：台灣時間 07:07、12:07、17:07、21:07
    - cron: '7 23,4,9,13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['info/**', '.github/workflows/info.yml']

permissions:
  contents: write

concurrency:
  group: atlas-info
  cancel-in-progress: false

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 取回上次的資料（info-data 分支）
        run: |
          mkdir -p info-out
          if git fetch --depth 1 origin info-data; then git archive FETCH_HEAD | tar -x -C info-out; fi
      - name: 抓公開資訊觀測站
        env:
          FULL: ${{ (github.event.schedule == '7 23,4,9,13 * * *' || github.event_name != 'schedule') && '1' || '0' }}
        run: python info/mops.py info-out
      - name: 發佈到 info-data 分支（只留最新一份）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd info-out
          git init -q -b info-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "觀測站 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" info-data
