name: 每日選股

on:
  schedule:
    # 週一到週五 台灣時間 19:17（UTC 11:17）；GitHub 排程可能延遲數十分鐘
    - cron: '17 11 * * 1-5'
  workflow_dispatch:   # 可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行篩選
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python screener/screener.py

      - name: 儲存結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "每日選股資料 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin main
            git push
          fi
