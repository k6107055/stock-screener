name: 歷史回測

on:
  schedule:
    # 每週六 台灣時間 10:23（UTC 02:23）重跑一次，納入最新一週資料
    - cron: '23 2 * * 6'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['screener/backtest.py', 'screener/sim.py', 'screener/history.py']

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行回測
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python screener/backtest.py

      - name: 儲存結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/backtest docs/data/hist
          if git diff --cached --quiet; then
            echo "沒有變化"
          else
            git commit -m "回測結果 $(TZ=Asia/Taipei date +%F)"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
